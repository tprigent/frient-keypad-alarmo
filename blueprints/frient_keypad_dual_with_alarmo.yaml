blueprint:
  name: "Frient Keypads x2 with Alarmo"
  description:
    "Keep two Zigbee2MQTT keypads and one alarm panel in sync.\n
    The panel state is mirrored on both keypads, and each keypad button is
    mapped to the panel action of your choice.\n
    Adapted from https://github.com/Bygood91/frient_keypad_alarmo (single keypad)."
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    panel:
      name: Alarm panel
      icon: mdi:shield-lock
      collapsed: false
      input:
        alarm_panel:
          name: Alarm panel
          description:
            "The panel the keypads control, and whose state they display.\n
            Example: Alarmo."
          selector:
            entity:
              domain:
                - alarm_control_panel
              multiple: false
    keypads:
      name: Keypads
      description:
        "The names of your two keypads in Zigbee2MQTT > Devices, spelled exactly
        as they are there (case sensitive). Their MQTT topics are derived from
        the names: zigbee2mqtt/<name> and zigbee2mqtt/<name>/set."
      icon: mdi:dialpad
      collapsed: false
      input:
        keypad_1_name:
          name: Keypad 1
          description: "Example: Keypad1"
          selector:
            text: {}
        keypad_2_name:
          name: Keypad 2
          description: "Example: Keypad2"
          selector:
            text: {}
    code:
      name: Code
      description:
        "A valid code is required for every action, the SOS button included.\n
        The codes below are the only ones checked, and the panel is driven
        without passing a code to it, so it must not ask for one: in Alarmo,
        General > Arming, turn OFF \"Code required for arming\" and \"Code
        required for disarming\"."
      icon: mdi:key-variant
      collapsed: false
      input:
        codes:
          name: Accepted codes
          description:
            "PIN codes and RFID tags accepted by both keypads, one entry per
            code. An RFID tag is identified by the action_code Zigbee2MQTT
            publishes when the tag is presented (Settings > Devices & Services >
            MQTT > Listen to a topic).\n
            Examples: 1234, +ACF5678B"
          selector:
            text:
              multiple: true
    buttons:
      name: Buttons
      description:
        "What each keypad button does on the panel. The SOS button never asks
        for a code."
      icon: mdi:gesture-tap-button
      collapsed: false
      input:
        button_away:
          name: Away button
          default: alarm_arm_away
          selector: &panel_action
            select:
              mode: dropdown
              options:
                - label: Arm away
                  value: alarm_arm_away
                - label: Arm home
                  value: alarm_arm_home
                - label: Arm night
                  value: alarm_arm_night
                - label: Arm vacation
                  value: alarm_arm_vacation
                - label: Disarm
                  value: alarm_disarm
                - label: Trigger the alarm
                  value: alarm_trigger
                - label: Do nothing
                  value: none
        button_home:
          name: Home / day button
          default: alarm_arm_home
          selector: *panel_action
        button_night:
          name: Night button
          default: alarm_arm_night
          selector: *panel_action
        button_disarm:
          name: Disarm button
          default: alarm_disarm
          selector: *panel_action
        button_panic:
          name: SOS button
          default: alarm_trigger
          selector: *panel_action
  source_url: https://github.com/tprigent/frient-keypad-alarmo/blob/main/blueprints/frient_keypad_dual_with_alarmo.yaml

# The Zigbee2MQTT base_topic. Change it here and in the variables below if
# yours is not the default.
trigger_variables:
  tv_base_topic: zigbee2mqtt
  tv_keypad_1_name: !input keypad_1_name
  tv_keypad_2_name: !input keypad_2_name

triggers:
  - trigger: state
    entity_id: !input alarm_panel
    to:
      - arming
      - pending
      - armed_away
      - armed_home
      - armed_night
      - armed_vacation
      - disarmed
      - triggered
    id: panel
  - trigger: mqtt
    topic: "{{ tv_base_topic }}/{{ tv_keypad_1_name | trim }}"
    id: keypad_1_mqtt
  - trigger: mqtt
    topic: "{{ tv_base_topic }}/{{ tv_keypad_2_name | trim }}"
    id: keypad_2_mqtt
  - trigger: homeassistant
    event: start
    id: resync

variables:
  panel_entity: !input alarm_panel
  base_topic: zigbee2mqtt
  keypad_1_name: !input keypad_1_name
  keypad_2_name: !input keypad_2_name
  keypad_1_set_topic: "{{ base_topic }}/{{ keypad_1_name | trim }}/set"
  keypad_2_set_topic: "{{ base_topic }}/{{ keypad_2_name | trim }}/set"
  # Every keypad that mirrors the panel. Duplicates are dropped so one message
  # is published per keypad.
  keypad_set_topics: "{{ [keypad_1_set_topic, keypad_2_set_topic] | unique | list }}"
  # A refused code is answered on the keypad it was typed on only.
  source_set_topic: >-
    {{ keypad_2_set_topic if (trigger is defined and trigger.id | default('') == 'keypad_2_mqtt')
       else keypad_1_set_topic }}
  codes_var: !input codes
  # Every code is kept as text: a template result is parsed back to its natural
  # type, so a numeric PIN would come back as a number and never match.
  valid_codes: >-
    {{ (codes_var if codes_var is string else codes_var | map('string') | join(';'))
       .split(';') | map('trim') | reject('eq', '') | map('string') | list }}
  # Keypad button -> panel service, as configured above.
  button_services:
    arm_all_zones: !input button_away
    arm_day_zones: !input button_home
    arm_night_zones: !input button_night
    disarm: !input button_disarm
    emergency: !input button_panic
  panel_state: >-
    {{ trigger.to_state.state if (trigger is defined and trigger.id | default('') == 'panel')
       else states(panel_entity) }}
  # Panel state -> what the keypads display.
  keypad_mode: >-
    {% set modes = {
      'arming': 'exit_delay',
      'pending': 'entry_delay',
      'armed_away': 'arm_all_zones',
      'armed_vacation': 'arm_all_zones',
      'armed_home': 'arm_day_zones',
      'armed_night': 'arm_night_zones',
      'disarmed': 'disarm',
      'triggered': 'in_alarm' } %}
    {{ modes.get(panel_state, '') }}

conditions: []

actions:
  - choose:
      # A keypad button was pressed.
      - conditions:
          - condition: trigger
            id:
              - keypad_1_mqtt
              - keypad_2_mqtt
        sequence:
          - condition: template
            value_template: "{{ trigger.payload_json is defined }}"
          - variables:
              keypad_action: "{{ trigger.payload_json.action | default('') | string }}"
              keypad_code: "{{ trigger.payload_json.action_code | default('') | string | trim }}"
              panel_service: "{{ button_services.get(keypad_action, 'none') }}"
              # Every action needs a valid code, the SOS button included. Drop
              # `keypad_action == 'emergency' or` from the line below to let SOS
              # through without one.
              # keypad_code is compared as text on both sides: a PIN of 1234
              # is handed back to this line as the number 1234, which matches
              # no entry in a list of strings.
              code_ok: >-
                {{ keypad_code | string | trim != ''
                   and keypad_code | string | trim in valid_codes | map('string') | list }}
              # The keypad quotes a transaction number on an arm / disarm
              # request and waits for it to come back. Without that reply it
              # reports the code as refused, whatever the panel does next.
              ack_transaction: "{{ trigger.payload_json.action_transaction | default('') }}"
              can_reply: >-
                {{ ack_transaction != ''
                   and keypad_action in ['arm_all_zones', 'arm_day_zones', 'arm_night_zones', 'disarm'] }}
          - choose:
              # Code accepted: acknowledge on the keypad first, so it accepts
              # the code, then drive the panel. The panel state change that
              # follows refreshes both keypads a moment later.
              - conditions:
                  - condition: template
                    value_template: "{{ panel_service != 'none' and code_ok }}"
                sequence:
                  - if:
                      - condition: template
                        value_template: "{{ can_reply }}"
                    then:
                      - action: mqtt.publish
                        data:
                          topic: "{{ source_set_topic }}"
                          payload: >-
                            {{ { 'arm_mode': {
                                   'transaction': ack_transaction,
                                   'mode': keypad_action } } | to_json }}
                  - action: "alarm_control_panel.{{ panel_service }}"
                    target:
                      entity_id: "{{ panel_entity }}"
              # Code refused: answer on the keypad it was typed on, and there
              # only.
              - conditions:
                  - condition: template
                    value_template: "{{ panel_service != 'none' and not code_ok and can_reply }}"
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "{{ source_set_topic }}"
                      payload: >-
                        {{ { 'arm_mode': {
                               'transaction': ack_transaction,
                               'mode': 'invalid_code' } } | to_json }}
            default: []
    # The panel changed state, Home Assistant started, or the automation was run
    # by hand: show the panel state on both keypads.
    default:
      - condition: template
        value_template: "{{ keypad_mode != '' }}"
      - repeat:
          for_each: "{{ keypad_set_topics }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: "{{ repeat.item }}"
                payload: "{{ { 'arm_mode': { 'mode': keypad_mode } } | to_json }}"

mode: parallel
max: 10
