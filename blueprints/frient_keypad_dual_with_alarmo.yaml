blueprint:
  name: "Frient Keypad x2 with Alarm Control Panel (ex: Alarmo)"
  description:
    "Synchronise TWO Zigbee2MQTT keypads with a single alarm control panel.\n
    The state of the alarm control panel is pushed to both keypads, and either
    keypad can arm / disarm the panel.\n
    Adapted from https://github.com/Bygood91/frient_keypad_alarmo (single keypad)."
  domain: automation
  homeassistant:
    min_version: 2024.10.0
  input:
    keypad_1:
      name: Keypad 1
      description: "MQTT topics of the first Zigbee2MQTT keypad."
      icon: mdi:dialpad
      collapsed: false
      input:
        keypad_1_topic:
          name: MQTT State Topic of Keypad 1
          description:
            "The State Topic is composed of your Zigbee2MQTT base_topic (see
            your Z2M Addon Configuration) and the Friendly Name of your keypad in Z2M.\n
            Example: zigbee2mqtt/Keypad1"
          selector:
            text: {}
        keypad_1_topic_set:
          name: MQTT Set Topic of Keypad 1
          description:
            "This is the same as the State Topic above, with the addition of /set.\n
            Example: zigbee2mqtt/Keypad1/set"
          selector:
            text: {}
    keypad_2:
      name: Keypad 2
      description:
        "MQTT topics of the second Zigbee2MQTT keypad.\n
        Both keypads share the same PIN codes, the same alarm panel and the same actions."
      icon: mdi:dialpad
      collapsed: false
      input:
        keypad_2_topic:
          name: MQTT State Topic of Keypad 2
          description: "Example: zigbee2mqtt/Keypad2"
          selector:
            text: {}
        keypad_2_topic_set:
          name: MQTT Set Topic of Keypad 2
          description: "Example: zigbee2mqtt/Keypad2/set"
          selector:
            text: {}
    keypad_codes:
      name: Keypad Codes
      description: "Access codes and RFID tags accepted by both keypads."
      icon: mdi:key-variant
      collapsed: false
      input:
        pin_list:
          name: Keypad Pincode List
          description:
            "A list of valid PIN codes and RFID tags that can be accepted by
            your keypads, separated by semicolons \" ; \".\n You can enter either a PIN code
            or an RFID tag for authentication.\n For example: 1234; +ACF5678B\n
            Surrounding spaces are ignored."
          selector:
            text: {}
    control_panel:
      name: Control Panel
      description: "Manage Control Panel settings and actions triggered by state changes."
      icon: mdi:shield-lock
      collapsed: false
      input:
        control_panel:
          name: Control Panel
          description: "An alarm control panel. \nExample: Alarmo or https://www.home-assistant.io/integrations/manual"
          selector:
            entity:
              domain:
                - alarm_control_panel
              multiple: false
        pin_control_panel:
          name: Control Panel Pincode
          description: The Valid PIN Code to be used for controlling Control Panel.
          selector:
            text: {}
    alarmo_actions:
      name: Actions Triggered by Control Panel State Change
      description: "Define the actions to be performed whenever the alarm panel state changes (e.g., armed, disarmed, triggered)."
      icon: mdi:shield-alert
      collapsed: true
      input:
        action_arming:
          name: Action Arming
          description:
            An action to be performed when the alarm panel changes to the arming
            state.
          default: []
          selector:
            action: {}
        action_armed_home:
          name: Action Armed Home
          description:
            An action to be performed when the alarm panel changes to the armed
            home state.
          default: []
          selector:
            action: {}
        action_armed_night:
          name: Action Armed Night
          description:
            An action to be performed when the alarm panel changes to the armed
            night state.
          default: []
          selector:
            action: {}
        action_armed_away:
          name: Action Armed Away
          description:
            An action to be performed when the alarm panel changes to the armed
            away state.
          default: []
          selector:
            action: {}
        action_armed_vacation:
          name: Action Armed Vacation
          description:
            An action to be performed when the alarm panel changes to the armed
            vacation state.
          default: []
          selector:
            action: {}
        action_disarmed:
          name: Action Disarmed
          description:
            An action to be performed when the alarm panel changes to the disarmed
            state.
          default: []
          selector:
            action: {}
        action_pending:
          name: Action Pending
          description:
            An action to be performed when the alarm panel changes to the pending
            state.
          default: []
          selector:
            action: {}
        action_panic:
          name: Action Panic
          description:
            An action to be performed when the panic / SOS button of one of the
            keypads is pressed.
          default: []
          selector:
            action: {}
        action_alarm:
          name: Action Alarm
          description: An action to be performed when alarm is triggered is pressed.
          default: []
          selector:
            action: {}
    custom_action_1:
      name: Special Pin Code 1
      description: "Set up a specific action to be triggered when PIN code 1 is entered (PIN code + any arming button), on either keypad."
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        custom_pincode_1:
          name: Pin Code 1
          description:
            "Enter the PIN code required to trigger custom action 1 via a keypad.\n
            You can either use the same code from the keypad PIN code list or enter a new code that will launch this action.\n
            Several codes can be given, separated by semicolons \" ; \"."
          default: ""
          selector:
            text: {}
        custom_action_1:
          name: Action for Pin Code 1
          description: "Define the action to execute when the PIN code 1 is entered on a keypad."
          default: []
          selector:
            action: {}
    custom_action_2:
      name: Special Pin Code 2
      description: "Set up a specific action to be triggered when PIN code 2 is entered (PIN code + any arming button), on either keypad."
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        custom_pincode_2:
          name: Pin Code 2
          description:
            "Enter the PIN code required to trigger custom action 2 via a keypad.\n
            You can either use the same code from the keypad PIN code list or enter a new code that will launch this action.\n
            Several codes can be given, separated by semicolons \" ; \"."
          default: ""
          selector:
            text: {}
        custom_action_2:
          name: Action for Pin Code 2
          description: "Define the action to execute when the PIN code 2 is entered on a keypad."
          default: []
          selector:
            action: {}
    custom_action_3:
      name: Special Pin Code 3
      description: "Set up a specific action to be triggered when PIN code 3 is entered (PIN code + any arming button), on either keypad."
      icon: mdi:gesture-tap-button
      collapsed: true
      input:
        custom_pincode_3:
          name: Pin Code 3
          description:
            "Enter the PIN code required to trigger custom action 3 via a keypad.\n
            You can either use the same code from the keypad PIN code list or enter a new code that will launch this action.\n
            Several codes can be given, separated by semicolons \" ; \"."
          default: ""
          selector:
            text: {}
        custom_action_3:
          name: Action for Pin Code 3
          description: "Define the action to execute when the PIN code 3 is entered on a keypad."
          default: []
          selector:
            action: {}
  source_url: https://github.com/tprigent/frient-keypad-alarmo/blob/main/blueprints/frient_keypad_dual_with_alarmo.yaml

variables:
  panel_entity: !input control_panel
  keypad_1_set_topic: !input keypad_1_topic_set
  keypad_2_set_topic: !input keypad_2_topic_set
  # Every keypad that has to mirror the panel state. Duplicates and blanks are
  # dropped so a single publish happens per keypad.
  keypad_set_topics: >-
    {{ [keypad_1_set_topic, keypad_2_set_topic] | map('trim') | reject('eq', '') | unique | list }}
  # Feedback (invalid code) must go back only to the keypad that was used.
  source_set_topic: >-
    {{ keypad_2_set_topic if (trigger is defined and trigger.id | default('') == 'keypad_2_mqtt')
       else keypad_1_set_topic }}
  panel_state: >-
    {{ trigger.to_state.state if (trigger is defined and trigger.id | default('') == 'panel')
       else states(panel_entity) }}
  keypad_mode: >-
    {% set modes = {
      'arming': 'exit_delay',
      'pending': 'entry_delay',
      'armed_away': 'arm_all_zones',
      'armed_vacation': 'arm_all_zones',
      'armed_home': 'arm_day_zones',
      'armed_night': 'arm_night_zones',
      'disarmed': 'disarm',
      'triggered': 'in_alarm' } %}
    {{ modes.get(panel_state, '') }}
  pin_list_var: !input pin_list
  pin_list: "{{ pin_list_var.split(';') | map('trim') | reject('eq', '') | list }}"
  custom_pincode_1_var: !input custom_pincode_1
  custom_pincode_2_var: !input custom_pincode_2
  custom_pincode_3_var: !input custom_pincode_3
  custom_pincodes_1: "{{ custom_pincode_1_var.split(';') | map('trim') | reject('eq', '') | list }}"
  custom_pincodes_2: "{{ custom_pincode_2_var.split(';') | map('trim') | reject('eq', '') | list }}"
  custom_pincodes_3: "{{ custom_pincode_3_var.split(';') | map('trim') | reject('eq', '') | list }}"
  pin_actions_list: "{{ custom_pincodes_1 + custom_pincodes_2 + custom_pincodes_3 }}"

triggers:
  - trigger: state
    entity_id: !input control_panel
    to:
      - arming
      - pending
      - armed_away
      - armed_home
      - armed_night
      - armed_vacation
      - disarmed
      - triggered
    id: panel
  - trigger: mqtt
    topic: !input keypad_1_topic
    id: keypad_1_mqtt
  - trigger: mqtt
    topic: !input keypad_2_topic
    id: keypad_2_mqtt
  - trigger: homeassistant
    event: start
    id: resync

conditions: []

actions:
  - choose:
      # ---------------------------------------------------------------
      # A keypad sent something: arm / disarm the panel, run custom PIN
      # actions, or reject the code on the keypad that was used.
      # ---------------------------------------------------------------
      - conditions:
          - condition: trigger
            id:
              - keypad_1_mqtt
              - keypad_2_mqtt
        sequence:
          - condition: template
            value_template: "{{ trigger.payload_json is defined }}"
          - variables:
              keypad_action: "{{ trigger.payload_json.action | default('') | string }}"
              keypad_code: "{{ trigger.payload_json.action_code | default('') | string | trim }}"
              keypad_code_known: >-
                {{ trigger.payload_json.action_code | default('') | string | trim in pin_list }}
          - choose:
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_code_known and keypad_action == 'arm_all_zones' }}"
                sequence:
                  - action: alarm_control_panel.alarm_arm_away
                    target:
                      entity_id: !input control_panel
                    data:
                      code: !input pin_control_panel
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_code_known and keypad_action == 'arm_day_zones' }}"
                sequence:
                  - action: alarm_control_panel.alarm_arm_home
                    target:
                      entity_id: !input control_panel
                    data:
                      code: !input pin_control_panel
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_code_known and keypad_action == 'arm_night_zones' }}"
                sequence:
                  - action: alarm_control_panel.alarm_arm_night
                    target:
                      entity_id: !input control_panel
                    data:
                      code: !input pin_control_panel
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_code_known and keypad_action == 'disarm' }}"
                sequence:
                  - action: alarm_control_panel.alarm_disarm
                    target:
                      entity_id: !input control_panel
                    data:
                      code: !input pin_control_panel
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_action == 'emergency' }}"
                sequence:
                  - choose: []
                    default: !input action_panic
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_code in custom_pincodes_1 }}"
                sequence: !input custom_action_1
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_code in custom_pincodes_2 }}"
                sequence: !input custom_action_2
              - conditions:
                  - condition: template
                    value_template: "{{ keypad_code in custom_pincodes_3 }}"
                sequence: !input custom_action_3
              # Unknown numeric code: tell the keypad it was refused, on the
              # keypad it was typed on only.
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ not keypad_code_known and keypad_code not in pin_actions_list
                         and keypad_code | int(-1) != -1 }}
                sequence:
                  - action: mqtt.publish
                    data:
                      topic: "{{ source_set_topic }}"
                      payload: >-
                        {{ { 'arm_mode': {
                               'transaction': trigger.payload_json.action_transaction | default(''),
                               'mode': 'invalid_code' } } | to_json }}
            default: []
    # -----------------------------------------------------------------
    # Panel state change (or Home Assistant start / manual run): mirror
    # the panel state on every keypad, then run the user actions.
    # -----------------------------------------------------------------
    default:
      - condition: template
        value_template: "{{ keypad_mode != '' }}"
      - repeat:
          for_each: "{{ keypad_set_topics }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: "{{ repeat.item }}"
                payload: "{{ { 'arm_mode': { 'mode': keypad_mode } } | to_json }}"
      # User actions only run on a real panel state change, not on a resync.
      - choose:
          - conditions:
              - condition: trigger
                id: panel
            sequence:
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ panel_state == 'arming' }}"
                    sequence:
                      - choose: []
                        default: !input action_arming
                  - conditions:
                      - condition: template
                        value_template: "{{ panel_state == 'pending' }}"
                    sequence:
                      - choose: []
                        default: !input action_pending
                  - conditions:
                      - condition: template
                        value_template: "{{ panel_state == 'armed_away' }}"
                    sequence:
                      - choose: []
                        default: !input action_armed_away
                  - conditions:
                      - condition: template
                        value_template: "{{ panel_state == 'armed_home' }}"
                    sequence:
                      - choose: []
                        default: !input action_armed_home
                  - conditions:
                      - condition: template
                        value_template: "{{ panel_state == 'armed_night' }}"
                    sequence:
                      - choose: []
                        default: !input action_armed_night
                  - conditions:
                      - condition: template
                        value_template: "{{ panel_state == 'armed_vacation' }}"
                    sequence:
                      - choose: []
                        default: !input action_armed_vacation
                  - conditions:
                      - condition: template
                        value_template: "{{ panel_state == 'disarmed' }}"
                    sequence:
                      - choose: []
                        default: !input action_disarmed
                  - conditions:
                      - condition: template
                        value_template: "{{ panel_state == 'triggered' }}"
                    sequence:
                      - choose: []
                        default: !input action_alarm
                default: []
        default: []

mode: parallel
max: 10
